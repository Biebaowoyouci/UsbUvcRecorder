plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.uvcrecorder'
    compileSdk 36

    defaultConfig {
        applicationId 'com.codex.uvcrecorder'
        minSdk 26
        targetSdk 36
        versionCode 40
        versionName '1.6.29'

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-datasource-rtmp:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.pedroSG94.RootEncoder:library:2.7.5'
    implementation project(':uvclib')

    testImplementation 'junit:junit:4.13.2'
}
